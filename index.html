eskrivs närmare.", "Arbeta med kontraster i tyngd och energi inom samma fras."], ["Improvisation", "Improvisation och eget skapande ingår.", "Läraren varierar graden av instruktion och överlåter successivt mer till eleven.", "Progressionen i frihetsgrad blir uttrycklig.", "Jämför en uppgift med givna parametrar och en där eleven själv väljer strukturen."], ["Breddande genrer", "Andra dansgenrers formspråk ingår i innehåll och kriterier.", "Breddande stilar ska komplettera den danstekniska utbildningen.", "Genrebredden kvarstår som del av teknikundervisningen.", "Använd korta uppgifter som visar vad som kännetecknar två olika formspråk."], ["Träning och hälsa", "Kroppskunskap, träningslära och skadeförebyggande arbete.", "Träning, akrobatik och psykologiska faktorer kring prestation behandlas med stegvis tillämpning.", "Praktiska och psykologiska delar knyts närmare till träningen.", "Låt eleven beskriva hur förberedelse och återhämtning hänger ihop med prestation."], ["Scen och samspel", "Sceniskt arbete, samarbete och framträdande ingår.", "Publikarbete, konstnärligt uttryck, pas de deux och partnering konkretiseras.", "Sceniskt samarbete får flera observerbara delar.", "Observera timing, samspel och uttryck i repetition och framträdande."], ["Träningsprocess", "Förberedelser, uppvärmning och träning är delar av högstadiets danstekniska innehåll.", "Träningsprocessens delar tillämpas återkommande och relateras till egna färdigheter och hälsa.", "Tillämpningen knyts närmare till långsiktig utveckling.", "Följ upp hur eleven förbereder sig och motiverar olika steg före teknikövningen."]], "Undervisning och bedömning": [["Ämnesstrategier", "Innehåll och slutkriterier styr dansarutbildningens ämnesarbete.", "Koreografi väljs för progression. Teori, danshistoria och reflektion integreras i praktiken.", "Mer vägledning för hur tekniken omsätts sceniskt.", "Återkom till en koreografi efter specifik respons och låt eleven beskriva en förändring."], ["Bedömningsunderlag", "Ämneskriterier anger kvaliteter i teknik, andra genrer och sceniskt arbete.", "Gemensam skala relateras till dansteknik, träning och sceniska mål.", "Enstaka föreställningar ger ett smalt underlag.", "Väg samman tekniklektioner, repertoar, samspel och praktiskt visad träningskunskap."]]}}, {"id": 7, "name": "Engelska", "category": "Engelska, moderna språk och teckenspråk", "note": "", "sources": [["Lgr22 · innehåll, s. 37", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=39"], ["Lgr22 · E-kriterier, s. 40", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=42"], ["Remissbilaga · PDF-sida 10", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9afb/1793969941189/Engelska%20%E2%80%93%20grundskola.pdf#page=10"]], "sections": {"Innehåll, likheter och skillnader": [["Läsning", "Reception samlar tal och skrift. Skönlitteratur och olika saktexter ingår.", "Läsning blir eget område med flera namngivna texttyper och kulturmöten i texterna.", "Läsmålen går lättare att planera separat.", "Pröva både översikt och tolkning av detaljer i två olika genrer."], ["Lyssnande", "Talad engelska i olika situationer och från olika medier.", "Personliga berättelser, intervjuer och andra muntliga texttyper placeras i en egen del.", "Skillnad mellan lyssnande och läsning syns tydligare.", "Använd ljudunderlag med olika talare och låt eleverna återge vad som stöder deras tolkning."], ["Muntlig framställning", "Presentationer, diskussion och samtal med anpassning till syfte och mottagare.", "Sammanhängande muntlig kommunikation, förberedda och spontana samtal samt arbete med stöd i receptionen.", "Mer uttalad progression till sammanhängande uttryck.", "Samla både en förberedd presentation och ett uppföljande spontant samtal."], ["Skriftlig framställning", "Berätta, beskriva, argumentera och bearbeta.", "Skrivande och skriftlig interaktion bildar eget område med både personliga och sakliga sammanhang.", "Interaktion går att synliggöra separat från textproduktion.", "Bedöm hur eleven anpassar texten när mottagaren byts."], ["Ordförråd och grammatik", "Ord, uttal, grammatik och andra strukturer ingår i reception och produktion.", "Egen rubrik för ordförråd och språkliga strukturer. Läraren förklarar mönster och uppmärksammar systematiska fel.", "Språkets byggstenar får tydligare plats.", "Välj några mönster från läst och lyssnat material och låt eleven använda dem i ny text."], ["Kommunikationsstrategier", "Strategier för förståelse och för att bidra till eller underlätta samtal anges uttryckligen.", "Strategier har mindre ställning som eget undervisningsstoff. Kommunikation övas i varierade sammanhang.", "Tyngdpunkten förskjuts mot språkkunskap i bruk.", "Ge återkoppling på hur budskapet fungerar i ett faktiskt utbyte."], ["Kultur", "Levnadsvillkor, traditioner, sociala relationer och kulturella företeelser i engelskspråkiga sammanhang.", "Perspektiven integreras i det talade och skrivna underlaget.", "Kultur och reception binds närmare samman.", "Låt eleverna motivera en jämförelse med stöd i en text eller ett ljudklipp."]], "Undervisning och bedömning": [["Ämnesstrategier", "Ämnet anger vad som ska behandlas.", "Engelska som huvudspråk, återkommande läsning och systematisk skrivvägledning anges.", "Mängdträning och vägledd bearbetning blir uttryckliga.", "Bygg en sekvens från läsning och modelltext till elevens egen text och revision."], ["Bedömningsunderlag", "Ämneskriterier för förståelse, produktion, interaktion och resonemang om förhållanden där engelska används.", "Gemensamma nivåbeskrivningar relateras till de förtydligade språkfärdigheterna.", "Förmågor behöver framträda i flera situationer.", "Använd underlag från läsning, lyssnande, skrivande och tal, inklusive spontant samspel."]]}}, {"id": 8, "name": "Fysik", "category": "Naturvetenskap, matematik och teknik", "note": "", "sources": [["Lgr22 · innehåll, s. 163", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=165"], ["Lgr22 · E-kriterier, s. 165", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=167"], ["Remissbilaga · PDF-sida 11", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9afc/1793969941212/Fysik%20%E2%80%93%20grundskola.pdf#page=11"]], "sections": {"Innehåll, likheter och skillnader": [["Mekanik", "Krafter, rörelser och förändringar samt tryck behandlas.", "Matematiska samband för rörelse, acceleration och densitet preciseras. Tryck behandlas i 5–7.", "Mer beräkning på högstadiet och omfördelat tryckstoff.", "Knyt ihop rörelsegraf, enhet och förklaring i ord. Repetera tryck där det behövs."], ["Värmelära", "Partikelmodell, fasövergångar och energiflöden ingår.", "Värmelära fördjupas i relation till energi. Materiens fasövergångar får huvudplacering i kemi.", "Fysik och kemi får tydligare arbetsdelning.", "Samordna värmeöverföring och fasövergångar över ämnesgränsen."], ["Energi", "Energins flöde och oförstörbarhet, energikällor och miljökonsekvenser.", "Bevarande och omvandlingar samt jämförelse av energikällor konkretiseras.", "Kärnan finns kvar. Kunskapen används i tydligare jämförelser.", "Låt eleverna rita en energikedja och motivera vad som omvandlas och sprids."], ["El och magnetism", "Samband mellan ström, spänning och resistans samt elektriska och magnetiska fenomen.", "Serie- och parallellkopplingar, magnetiska effekter av ström och kretsundersökningar preciseras.", "Fler specificerade tillämpningar.", "Låt eleverna förutsäga, mäta och förklara skillnaden mellan två kopplingar."], ["Ljus, ljud och strålning", "Ljus, ljud och strålning utifrån spridning, reflektion och tillämpningar.", "Brytning, frekvens och våglängd samt elektromagnetisk strålning organiseras kring vågrörelse.", "Vågbegrepp kan kopplas tydligare mellan fenomen.", "Bedöm om eleven kan översätta mellan vågbild, mätning och förklaring."], ["Astronomi", "Universums uppkomst och utveckling samt himlakroppar och modeller.", "Astronomi kvarstår, med solsystemets historia introducerad i 5–7 och tyngd på skala, rum och tid.", "Innehåll byggs upp över fler stadier.", "Använd skilda representationer för storlek och avstånd. Låt eleven förklara varför samma bild sällan visar båda skalenligt."], ["Undersökning och samhälle", "Systematiska undersökningar och granskning av information hålls ihop.", "Undersökningar skiljs från Fysiken och samhället. Modeller och mätresultat används med tydligt syfte.", "Metod och samhällstillämpning synliggörs var för sig.", "Samla både en tolkning av experimentella data och ett fysikunderbyggt resonemang om ett teknikval."], ["Modeller och ämnesspråk", "Fysikens begrepp och förklaringsmodeller används för att beskriva fenomen.", "Modeller och bilder knyts till tydlig undervisning om betydelseskillnader mellan fysikaliska och vardagliga uttryck.", "Språkliga skillnader blir tydligare i strategierna.", "Använd vardagsordet kraft som utgångspunkt och pröva elevens fysikaliska användning i en ny situation."]], "Undervisning och bedömning": [["Ämnesstrategier", "Innehåll och kriterier styr experimentellt arbete.", "Läraren visar utrustning, modellerar frågor och kopplar modeller och språk till fenomen. Laborationssalar anges.", "Mer uttrycklig struktur före självständigt arbete.", "Modellera hur en variabel isoleras före elevens egen mätserie."], ["Bedömningsunderlag", "Ämneskriterier om begrepp, förklaringsmodeller, samhällsfrågor och undersökningar.", "Gemensamma nivåbeskrivningar används mot bland annat mer specificerade fysikaliska samband.", "Beräkning och begreppsförståelse behöver kunna visas tillsammans.", "Bedöm enheter, rimlighet och modellval utöver räknesvaret."]]}}, {"id": 9, "name": "Geografi", "category": "Samhällsorienterande ämnen", "note": "", "sources": [["Lgr22 · innehåll, s. 176", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=178"], ["Lgr22 · E-kriterier, s. 178", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=180"], ["Remissbilaga · PDF-sida 11", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9afd/1793969941236/Geografi%20%E2%80%93%20grundskola.pdf#page=11"]], "sections": {"Innehåll, likheter och skillnader": [["Karta och plats", "Namngivna platser och regioner samt kartor och geografiska metoder.", "Platsbunden information kombineras från flera källor. Platser repeteras genom geografiska processer.", "Plats och tema länkas systematiskt.", "Låt eleverna kombinera två temakartor och förklara både mönster och avvikelser."], ["Klimat", "Klimat, klimatförändringars orsaker och konsekvenser samt åtgärder.", "Pågående förändringar kopplas till olika platser, klimatanpassning och konflikter kring utsläppsminskning.", "Regionala skillnader och handlingsalternativ konkretiseras.", "Jämför samma klimatrisk i två regioner med olika förutsättningar."], ["Jordytan", "Endogena och exogena processer och deras följder.", "Processer studeras med konkreta landskapsformer och platsanknytning.", "Samma processer kan prövas i fler namngivna geografiska sammanhang.", "Låt eleven skilja process från landskapsform och belägga sambandet med kartdata."], ["Resurser och handel", "Produktion, konsumtion och tillgång till naturresurser i olika delar av världen.", "Handels- och produktionsmönster blir tydligt fokus i globalisering.", "Resursfrågan binds närmare till försörjningskedjor.", "Följ en råvara genom utvinning, bearbetning, handel och användning."], ["Befolkning", "Befolkningsfördelning, migration, urbanisering och levnadsvillkor.", "Fördelning och migration ska återkomma i arbetet med olika geografiska frågor.", "Begreppen återanvänds över flera arbetsområden.", "Kombinera karta och befolkningsdata för att förklara ett migrationsmönster."], ["Hållbar utveckling", "Eget innehållsområde med miljö- och utvecklingsfrågor.", "Hållbarhetsfrågor integreras i klimat, resurser och befolkningsfrågor.", "Placeringen förändras och ämnesstoffet blir utgångspunkt för analysen.", "Bygg in aktörsperspektiv och avvägningar i varje berört tema."], ["Metoder och fältstudier", "Kartor, geografiska informationssystem och fältstudier ingår.", "Kartor, tabeller och diagram används tillsammans. Läraren ska sträva efter exkursioner och fältstudier.", "Fältarbete kvarstår och strategin preciserar genomförandet.", "Låt elevens observationer möta kartunderlag och diskutera hur skalan påverkar slutsatsen."], ["Global ojämlikhet", "Orsaker till och konsekvenser av fattigdom och ohälsa samt människors tillgång till resurser.", "Levnadsvillkor och globala skillnader behandlas i samband med bland annat resurser och befolkningsfrågor.", "Ekonomiska och sociala frågor förankras i geografiska mönster.", "Låt eleven använda statistik och karta för att skilja geografisk samvariation från en förklaring."]], "Undervisning och bedömning": [["Ämnesstrategier", "Lgr22 ger centralt innehåll utan motsvarande ämnesstrategier.", "Lärarens förklaringar, geografiska representationer och allsidig behandling av omstridda frågor lyfts.", "Lärarens val av modeller och fall blir mer synligt.", "Modellera en geografisk förklaring innan eleverna analyserar en ny plats."], ["Bedömningsunderlag", "Ämneskriterier för processer, geografiska förhållanden, hållbar utveckling och metoder.", "Gemensam skala relateras till konkreta processer och platsbunden information.", "Underlag behöver visa både orientering och geografisk förklaring.", "Kombinera en kartuppgift, en orsaksförklaring och en jämförelse av två handlingsalternativ."]]}}, {"id": 10, "name": "Grundläggande svenska", "category": "Svenskämnen", "note": "Grundläggande svenska är en föreslagen kursplan inom ämnet svenska som andraspråk för nybörjare. Lgr22-kolumnen beskriver det närmaste jämförelseunderlaget, svenska som andraspråk.", "sources": [["Lgr22 · svenska som andraspråk", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=248"], ["Remissbilaga · PDF-sida 3", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9afe/1793969941260/Grundl%C3%A4ggande%20svenska%20%E2%80%93%20grundskola.pdf#page=3"]], "sections": {"Innehåll, likheter och skillnader": [["Kursplanens plats", "Svenska som andraspråk har en stadieindelad kursplan som också används för elever som är nybörjare.", "Grundläggande svenska föreslås som en andra kursplan inom ämnet svenska som andraspråk för nybörjare.", "Ny kursplan utan direkt motsvarighet i Lgr22.", "Planera elevens väg till ordinarie svenska som andraspråk och dokumentera övergången."], ["Progression", "Centralt innehåll för högstadiet gäller som stadieram.", "I årskurs 8–10 används nivå 1–5 med mål för att gå vidare, utan angiven tid per nivå.", "Progressionen styrs av språkutvecklingen.", "Kartlägg lyssnande, samtal, läsning och skrivande var för sig. Följ upp med jämna mellanrum."], ["Första muntliga färdigheter", "Muntlig kommunikation, uttal och strategier för att förstå och göra sig förstådd.", "I nivå 1 övas till exempel presentation och enkla frågor, med fokus på språkljud och förståelse.", "De första muntliga stegen får egna mål.", "Använd en förberedd kort dialog och därefter ett liknande utbyte med nytt innehåll."], ["Avkodning", "Lässtrategier och arbete med ord, texter och läsflyt inom högstadiets innehåll.", "Nivåerna börjar med fonologisk medvetenhet och koppling mellan fonem och grafem där eleven behöver det.", "Grundläggande läsfärdighet kan behandlas inom en högstadiekursplan.", "Skilj läsning på svenska från allmän läsfärdighet och ta hänsyn till elevens tidigare skriftspråk."], ["Tidigt skrivande", "Skrivande i olika genrer och svenskans normer för språkriktighet.", "Från bokstäver, ord och korta uttryck till enkla sammanhängande texter.", "Skrivprogressionen för nybörjaren specificeras.", "Använd åldersrelevanta bilder och skriv tillsammans före elevens egen text."], ["Ordförråd och grammatik", "Vardagsspråk, skolspråk, grammatik och varierat ordval ingår.", "Ordförråd och återkommande språkliga mönster byggs upp med tydligt lärarstöd genom nivåerna.", "Ordförrådsundervisningen knyts till vad eleven kan göra på sin nivå.", "Kontrollera om nya ord fungerar både vid lyssnande och i eget tal eller egen text."], ["Nivå 5", "Högstadiets ordinarie kursplan innehåller mer avancerad sakprosa och litteratur, och mer komplex produktion.", "Den femte nivån utvecklar muntlig kommunikation, läsning och skrivprocess inför övergången.", "Nivå 5 fungerar som bro till högstadiets svenska som andraspråk.", "Planera uppgifter där eleven läser en enkel åldersrelevant text och återger och bearbetar innehållet."]], "Undervisning och bedömning": [["Ämnesstrategier", "Lgr22 framhäver språkstödjande arbete och elevens språkliga resurser.", "Gemensam läsning och gemensamt skrivande varvas med eget arbete. Tydliga ramar ska ge alla tid att tala.", "Undervisningens organisation konkretiseras.", "Modellera ett samtal, öva i par och följ upp med ett individuellt stickprov."], ["Bedömningsunderlag", "Svenska som andraspråk har betygskriterier för slutet av årskurs 9.", "Grundläggande svenska saknar egna betygs- och bedömningskriterier. Nivåmål vägleder progression och övergång.", "Nivåerna är undervisningsnivåer.", "Samla belägg för att eleven är redo för nästa nivå eller den andra kursplanen."]]}}, {"id": 11, "name": "Hem- och konsumentkunskap", "category": "Övningsämnen", "note": "", "sources": [["Lgr22 · innehåll, s. 44", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=46"], ["Lgr22 · E-kriterier, s. 46", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=48"], ["Remissbilaga · PDF-sida 5", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9aff/1793969941285/Hem-%20och%20konsumentkunskap%20%E2%80%93%20grundskola.pdf#page=5"]], "sections": {"Innehåll, likheter och skillnader": [["Matlagning", "Metoder och redskap samt recept och andra instruktioner.", "Sjuda, bryna, beräkna mängder och anpassa recept efter råvaror, säsong och rester.", "Det praktiska kunnandet konkretiseras.", "Låt eleven anpassa ett recept efter ändrad portionsstorlek och förklara metodvalet."], ["Råvaror och processer", "Livsmedel och hur matlagning påverkar hälsa, ekonomi och miljö.", "Temperatur, tid och metod kopplas till fysiska och kemiska förändringar, smak och konsistens.", "Mer explicit förklaring av det praktiska resultatet.", "Tillaga samma råvara på två sätt och jämför utfallet."], ["Näring och säkerhet", "Sammansättning av måltider, hygien och livsmedelshantering.", "Näringslära, individuella kostbehov och mikroorganismer vid avsvalning, kokning och frysning preciseras.", "Säkerhet och näring får konkreta tillämpningar.", "Låt eleven planera förvaring och motivera val med tid, temperatur och måltidens behov."], ["Hushållsarbete", "Rutiner och metoder för rengöring och tvätt.", "Dammsugning, våttorkning, tvättsortering och jämförelse av metoder konkretiseras.", "Fler vardagsfärdigheter blir tydliga.", "Bedöm val av metod genom funktion, miljö, hälsa och kostnad."], ["Hemberedskap", "Ingen motsvarande uttrycklig punkt om simulerade el- och vattenavbrott.", "Hemberedskap övas i simulerade situationer. Vattenbehov och grannsamarbete ingår.", "Nytt konkret kunskapsområde.", "Låt eleverna planera en måltid vid ett fiktivt elavbrott och fördela uppgifter."], ["Ansvar och samlevnad", "Arbetsfördelning i hemmet ur jämställdhetsperspektiv.", "Rättvis arbetsfördelning, utvärderat samarbete, samboskap och äktenskap tas upp.", "Normer och juridiska samlevnadsformer konkretiseras.", "Använd ett fiktivt hushåll för att skilja praktiskt ansvar från rättsliga villkor."], ["Privatekonomi", "Budget, lån, sparande, abonnemang och konsumenträtt.", "Boendekostnad, avbetalning, betalningsanmärkning och köp från privatperson preciseras.", "Villkor och följder synliggörs.", "Bedöm en budget och jämförelse av totalkostnad och rättigheter för olika köp."], ["Digital konsumtion", "Reklam och information i olika medier samt konsumenters rättigheter och skyldigheter.", "Betalsäkerhet, influerare, algoritmer och kommersiell persondata namnges.", "Digitala påverkansmekanismer blir undervisningsstoff.", "Låt eleven granska avsändare, sponsring och villkor i ett simulerat köp."], ["Märkningar och resursval", "Val av varor och tjänster samt olika märkningar behandlas.", "Certifieringar kopplas till produktion, transport, återvinning och gemensamma resurser.", "Varuval bedöms i ett tydligare livscykelperspektiv.", "Jämför två varor där märkning, pris och transport pekar åt olika håll."]], "Undervisning och bedömning": [["Ämnesstrategier", "Planering, genomförande och värdering ingår som ämnesinnehåll.", "Praktiskt arbete prioriteras. Läraren synliggör lärandet och fördelar och följer upp grupproller.", "Enskilda prestationer i grupp görs lättare att se.", "Rotera roller och observera flera elever i samma färdighet vid olika tillfällen."], ["Bedömningsunderlag", "Kriterier gäller tillagning och annat praktiskt arbete, ekonomi och konsumtion samt hälsa, ekonomi och miljö.", "Gemensam skala används mot mål för bland annat matlagning, hemkunskap och konsumentkunskap.", "Bedömningen behöver täcka hela ämnets bredd.", "Kombinera köksobservation med individuella fall om hemberedskap och ekonomi."]]}}, {"id": 12, "name": "Historia", "category": "Samhällsorienterande ämnen", "note": "", "sources": [["Lgr22 · innehåll, s. 183", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=185"], ["Lgr22 · E-kriterier, s. 186", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=188"], ["Remissbilaga · PDF-sida 12", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9b00/1793969941307/Historia%20%E2%80%93%20grundskola.pdf#page=12"]], "sections": {"Innehåll, likheter och skillnader": [["Periodisering", "Högstadiet börjar med tidiga civilisationer och antiken och går vidare till modern historia.", "Tidiga civilisationer och antiken flyttas till 5–7. Högstadiet koncentreras på kolonisation och industrialisering framåt.", "Ändrad stadieplacering skapar utrymme för fördjupning.", "Repetera en tidigare period när den behövs som bakgrund till ett nytt sammanhang."], ["Kolonisation och slaveri", "Europeisk kolonisation och slavhandel samt deras konsekvenser.", "Kolonisationens och slavhandelns förlopp och konsekvenser konkretiseras.", "Samma stoff får en mer avgränsad referensram.", "Använd karta, tidslinje och en kort källa för att koppla aktörer till följder."], ["Upplysning och revolutioner", "Revolutioner, idéer och framväxten av ett modernt samhälle.", "Upplysningens idéer kopplas till namngivna omvandlingar, däribland 1766 års tryckfrihetsförordning i kursplanen.", "Vissa historiska hållpunkter specificeras.", "Låt eleven koppla en idé om frihet till ett historiskt beslut och visa vad det förändrade."], ["Industrialisering", "Industrialiseringen i Europa och Sverige och konsekvenser för människor.", "Industrialiseringen organiseras i samma kunskapsområde som kolonisation och upplysning, med konkretisering av drivkrafter och följder.", "Fler uttalade samband mellan utvecklingsprocesser.", "Jämför förändringar i arbete och boende mellan två orter eller perioder."], ["Imperialism och krig", "Nationalism, imperialism och världskrigen ingår.", "Tysklands enande, Osmanska rikets utveckling och specificerade händelsekedjor sätts in i ramen.", "Geografiska och politiska hållpunkter förtydligas.", "Bedöm hur eleven knyter långsiktiga faktorer till ett kortsiktigt utlösande skeende."], ["Förintelsen och folkmord", "Förtryck, folkfördrivningar och folkmord, däribland Förintelsen.", "Nazismens centrala idéer och förföljelse konkretiseras. Även andra folkmord behandlas.", "Mer detaljerad bakgrund för jämförelser.", "Arbeta med en tydlig kronologi och bedöm historisk förklaring med stöd i ett källmaterial."], ["Sverige och minoriteter", "Demokratisering, välfärd och nationella minoriteters historia.", "Välfärdsreformer, jämställdhet och minoriteter förankras i specifika historiska sammanhang.", "Minoriteterna knyts tydligare till den gemensamma kronologin.", "Låt eleverna jämföra formella rättigheter med människors faktiska villkor i ett historiskt fall."], ["Kalla kriget och samtid", "Kalla krigets konflikter och nya internationella relationer.", "Nato, Warszawapakten och utvalda samtidshistoriska processer ger struktur.", "Kalla kriget konkretiseras, medan urvalet av samtidshistoria lämnar utrymme.", "Använd karta och tidslinje för att förklara hur en regional konflikt hänger ihop med blockpolitiken."], ["Källkritik", "Källkritiska frågor och egna slutsatser utifrån historiska källor.", "Källmaterial ger inblick i historikerns arbete. Egna källtolkningar får mer avgränsad plats.", "Källkritik finns kvar med ändrad tyngdpunkt.", "Välj korta källövningar där eleverna redan känner till det historiska sammanhanget."], ["Historiebruk", "Eget innehåll och en del av slutkriterierna.", "Stryks som särskilt kunskapsområde enligt konsekvensutredningen. Spår av historia och historiska sammanhang behandlas.", "En tidigare uttrycklig bedömningsdimension försvinner som sådan.", "Se över uppgifter om hur historia används och koppla dem till kvarvarande historiskt stoff."]], "Undervisning och bedömning": [["Ämnesstrategier och bedömning", "Ämnesspecifika kriterier för historiska kunskaper, källor och historiebruk.", "Berättande, texter och tidslinjer lyfts. Gemensam skala tillämpas på stadiets innehåll.", "Kronologi, begrepp och förklaringar behöver visas i varierade sammanhang.", "Samla en kronologisk översikt, en jämförande förklaring och en avgränsad källtolkning."]]}}, {"id": 13, "name": "Idrott och hälsa", "category": "Övningsämnen", "note": "", "sources": [["Lgr22 · innehåll, s. 50", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=52"], ["Lgr22 · E-kriterier, s. 52", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=54"], ["Remissbilaga · PDF-sida 9", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9b01/1793969941330/Idrott%20och%20h%C3%A4lsa%20%E2%80%93%20grundskola.pdf#page=9"]], "sections": {"Rörelse och träning": [["Rörelseförmåga", "Komplexa rörelser i lekar, spel, idrotter och andra rörelseaktiviteter.", "Tillämpa, variera, kombinera och anpassa rörelser med kraft, avspänning, tajming, balans, tempo, rytm och precision.", "Rörelsekvaliteter beskrivs tydligare.", "Låt eleverna pröva samma rörelse under förändrade krav på tempo, balans eller precision. Samla observationer över flera aktiviteter."], ["Bollspel", "Lekar, spel och idrotter ingår.", "Olika idrotter ingår, men bollspel är inte uttryckligen utpekat i 8–10-avsnittet.", "Fortfarande möjligt, men inte namngivet som eget moment.", "Planera bollspel utifrån vilka rörelsekvaliteter eleverna ska öva. Använd speluppgifter där varje elev får upprepade tillfällen."], ["Styrka och kondition", "Träningslära och träning av styrka, kondition, koordination och rörlighet.", "Praktisk erfarenhet av styrka, kondition, uthållighet, rörlighet och kroppskontroll samt träningsformernas effekter.", "Tydligare koppling mellan praktisk träning och kunskap.", "Låt eleverna uppleva och jämföra två träningsformer och koppla utförande och återhämtning till möjliga effekter."], ["Redskap och parkour", "Redskapsaktiviteter ryms inom rörelseområdet.", "Parkour och styrketräning med eller utan redskap nämns som exempel.", "Parkour anges uttryckligen som exempel.", "Använd stationer med olika höjd och svårighetsgrad för att följa kontroll, balans och anpassning."], ["Dans", "Olika dansformer samt rörelse och träningsprogram till musik.", "Rytm, pardans med föra/följa, egna koreografier och kreativt uttryck.", "Pardans konkretiseras.", "Observera föra och följa i pardans och låt sedan eleverna sätta ihop en egen fras till musik."], ["Simning", "Olika simsätt i mag- och ryggläge samt 200 meter, varav 50 meter i ryggläge, i betygskriterierna.", "Eleverna ska återkommande kunna simma 200 meter i följd på djupt vatten med valfritt simsätt, varav minst 50 meter ryggsim. Olika simsätt och undervattensmoment övas.", "Simkravet placeras i mål och innehåll och preciseras.", "Planera kontinuerlig simträning. Dokumentera hela sträckan, ryggsimmet och hur eleven hanterar undervattensmoment."], ["Uppvärmning", "Skadeförebyggande arbete och belastningsanpassning.", "Förberedelser inför aktiviteter utifrån deras särskilda krav.", "Mer aktivitetsanpassat.", "Låt eleven förklara hur en förberedelse för riktningsbyten skiljer sig från en för ett lugnare uthållighetspass."], ["Planering och värdering", "Planera, genomföra och värdera rörelseaktiviteter utifrån fysisk förmåga och hälsa.", "Praktisk erfarenhet och förståelse av träningsformer och deras effekter.", "Egen planering och värdering är mindre uttryckligt framträdande i 8–10-innehållet.", "Behåll träningsplanering som lärandeaktivitet där den stödjer syftet. Relatera bedömningen till det uttryckliga innehållet i rätt kursplan."]], "Hälsa": [["Återhämtning", "Kan behandlas inom träning och hälsa.", "Återhämtning nämns uttryckligen.", "Mer specificerat.", "Koppla återhämtning till en praktisk träningsperiod och låt eleven beskriva hur belastningen kan varieras."], ["Stresshantering", "Kan ingå i undervisning om hälsa.", "Andning, muskelavslappning och spänningsreglering anges uttryckligen.", "Praktisk stresshantering konkretiseras.", "Öva teknikerna och låt eleverna förklara när de kan användas i en fiktiv situation."], ["Kroppsideal", "Kroppsideal och normer i rörelsekulturer och deras påverkan på deltagande.", "Kroppsideal i relation till hälsa.", "Annan tyngdpunkt.", "Jämför budskap om kroppar i två medier. Låt eleverna analysera budskapets koppling till hälsa."], ["Kost och källkritik", "Hälsa och levnadsvanor; digitala verktyg för träning.", "Granska påståenden om träning, kost och hälsa i medier.", "Mediekritisk granskning blir tydlig.", "Låt eleverna granska vem som står bakom ett påstående om kost eller träning och vilket stöd som finns."], ["Dopning", "Dopning och förbud mot dopning nämns uttryckligen.", "Dopning nämns inte uttryckligen i 8–10-innehållet.", "Dopning får mindre uttrycklig plats i högstadiets innehåll.", "Knyt eventuella dopningsexempel till kvarvarande innehåll om hälsa eller källgranskning."], ["Närmiljö", "Friluftsaktiviteter och rörelse i olika miljöer ingår.", "Eleverna ska få kunskap och praktisk erfarenhet av möjligheter till rörelse, idrott och friluftsliv i närsamhället.", "Lokala möjligheter blir tydligare innehåll.", "Låt eleverna undersöka vilka platser som fungerar för olika aktiviteter och motivera valen."]], "Friluftsliv och säkerhet": [["Friluftsliv", "Planera och genomföra friluftsaktiviteter i olika miljöer och årstider.", "Kläder, packning, skydd, vila, matlagning och att hålla sig trygg, torr, varm och mätt.", "Fler konkreta praktiska färdigheter.", "Ge en praktisk uppgift där eleverna väljer packning, viloplats och matmetod för en angiven årstid."], ["Orientering", "Orientera sig i okända miljöer med kartor och andra hjälpmedel, med och utan digitala verktyg.", "Karta och kompass, avståndsbedömning, kartpassning och vägval.", "Kompass blir uttryckligt; digitala hjälpmedel nämns inte.", "Observera kartpassning och avståndsbedömning och låt eleverna motivera olika vägval."], ["Allemansrätt", "Rättigheter och skyldigheter enligt allemansrätten.", "Friluftsliv utifrån allemansrätten.", "Liknande innehåll.", "Pröva allemansrätten i fiktiva fall om mark, eldning och gruppens påverkan på platsen."], ["Livräddning", "Badvett, säkerhet och nödsituationer i och vid vatten.", "Is- och badvett, egen säkerhet och förlängda armen från land.", "Mer konkreta övningar.", "Öva egen säkerhet och förlängda armen med säkra, avgränsade undervisningssituationer."], ["Första hjälpen", "Första hjälpen och HLR.", "Prioritera vid olycksfall samt HLR.", "Prioritering nämns uttryckligen.", "Observera handlingsordning i en fiktiv olyckssituation och praktiskt genomförd HLR-övning."]], "Undervisning och bedömning": [["Arbetsområden", "Ingen motsvarande ämnesspecifik formulering om längden på arbetsområden.", "Längre sammanhängande arbetsområden och återkommande övning.", "Tydligare långsiktig progression.", "Använd sammanhängande block med återbesök så att elever kan befästa rörelser och friluftsfärdigheter."], ["Lärarledd övning", "Metodval huvudsakligen inom lärarens professionella ansvar.", "Demonstration, härmning, anpassning och riktad återkoppling.", "Undervisningsmetoder specificeras.", "Visa en rörelse stegvis och använd en tydlig återkopplingspunkt per nytt försök."], ["Individanpassning", "Alla elever ska kunna delta och utvecklas.", "Mindre grupper, varierade uppgifter, stöd, svårighetsgrad och fördelning av utrymme.", "Fler konkreta exempel på anpassningar.", "Anpassa yta och material. Följ hur olika grupper får utrymme och övningstid."], ["Bedömning", "A–F med ämnesspecifika kriterier för rörelse, friluftsliv, planering och säkerhet.", "Gemensamma nivåer på skalan 1–10 och sammantagen bedömning mot stadiets mål och innehåll. Simsträckan står i mål och innehåll.", "Gemensamma nivåbeskrivningar och ämnesspecifika mål och innehåll.", "Väg samman rörelse, hälsa, friluftsliv, simning och säkerhet utifrån relevanta observationer och uppgifter."]]}}, {"id": 14, "name": "Judiska studier", "category": "Samhällsorienterande ämnen", "note": "Judiska studier är en kursplan för särskild utbildning i grundskolan.", "sources": [["Gällande kursplan och betygskriterier", "https://syllabuswebb.skolverket.se/compulsorycw/jsp/subject.htm?subjectCode=GRGRJUD01&tos=gr"], ["Remissbilaga · PDF-sida 2", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9b02/1793969941354/Judiska%20studier%20%E2%80%93%20grundskola.pdf#page=2"]], "sections": {"Innehåll, likheter och skillnader": [["Skrifter", "Religiösa urkunder och deras roll i olika traditioner.", "Tanakhs böcker, Talmud och midrash konkretiseras. Chevruta anges för lärarledd tolkning.", "Texter och tolkningsmetod namnges.", "Låt eleverna i par jämföra två tolkningar och visa vilket textstöd de använder."], ["Riter", "Levnadsregler, högtider, övergångsriter och traditioner i hemmet.", "Kosher, sabbatsfirande och havdala knyts till skrifter, bakgrund och nutida praktik.", "Fler exempel på relation mellan text och praktik.", "Jämför hur en högtid eller rit kan ta sig olika uttryck."], ["Inriktningar", "Olika judiska inriktningar, trosuppfattningar och religiös praktik.", "Reformjudendom, konservativ och ortodox judendom preciseras tillsammans med rekonstruktionism.", "Namngivna inriktningar och idéhistorisk bakgrund.", "Låt eleven förklara både gemensamma drag och skillnader med sakliga exempel."], ["Identitet och idéströmningar", "Judiska identiteter och förhållningssätt behandlas.", "Religiösa, kulturella och etniska dimensioner kopplas till haskala och sionistiska förhållningssätt.", "Identitet organiseras tydligare kring flera dimensioner.", "Skilj ett historiskt idébegrepp från senare tolkningar och individuella identiteter."], ["Tidig historia och diaspora", "Judisk historia, diaspora och olika judiska gruppers erfarenheter.", "Andra templets förstörelse och exempel från askenasiska, sefardiska, mizrahiska och etiopiska miljöer preciseras.", "Fler historiska och geografiska jämförelsepunkter.", "Låt eleverna jämföra två miljöer och förklara hur minoritet och majoritet har påverkat varandra."], ["Sverige och emancipationen", "Judiskt liv i Sverige, minoritetsställning och historiska villkor.", "Den första permanenta etableringen, gradvisa medborgerliga rättigheter och nutida miljöer knyts ihop.", "Svensk-judisk historia får en tydligare utvecklingslinje.", "Använd en tidslinje för att visa skillnaden mellan etablering och fullare rättigheter."], ["Förintelsen och antisemitism", "Förintelsen och antisemitism över tid behandlas.", "Svensk-judiska och svenska reaktioner samt berättelser om minne och familjeliv lyfts.", "Minnesperspektivet och olika svenska reaktioner konkretiseras.", "Kombinera vittnesmål med bakgrundskällor och låt eleven skilja minne från historisk förklaring."], ["Israel", "Israels tillkomst och betydelse för judisk identitet ingår.", "Samhällsutveckling i politik, ekonomi och befolkning samt internationella relationer konkretiseras.", "Fler aspekter av samma område.", "Använd tidslinje och källor för att hålla isär statens utveckling och olika judiska förhållningssätt."]], "Undervisning och bedömning": [["Ämnesstrategier", "Innehåll, källor och kriterier ger ramen.", "Lärarens berättande, läsning, allsidighet i omstridda frågor och studiebesök anges.", "Undervisning i omstridda frågor och möten med kulturmiljöer får tydligare stöd.", "Knyt ett studiebesök till förberedda frågor och en faktabaserad uppföljning."], ["Bedömningsunderlag", "Ämnesspecifika kriterier för religion, historia, kultur och resonemang.", "Gemensamma nivåer används mot mål och innehåll, däribland tolkning, begrepp och perspektiv.", "Bedömningen behöver visa flera kunskapsområden.", "Samla texttolkning, historisk förklaring och ett underbyggt resonemang om identitet."]]}}, {"id": 15, "name": "Kemi", "category": "Naturvetenskap, matematik och teknik", "note": "", "sources": [["Lgr22 · innehåll, s. 169", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=171"], ["Lgr22 · E-kriterier, s. 171", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=173"], ["Remissbilaga · PDF-sida 10", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9b03/1793969941375/Kemi%20%E2%80%93%20grundskola.pdf#page=10"]], "sections": {"Innehåll, likheter och skillnader": [["Atommodell", "Partikelmodeller för att beskriva materiens uppbyggnad och egenskaper.", "Bohrs atommodell och ordningen i periodiska systemet preciseras.", "Mer bestämt modellinnehåll.", "Låt eleverna förklara vad en modell visar och hur ett grundämne identifieras."], ["Kol", "Kolatomens egenskaper och kolbaserade föreningar.", "Rent kols former och kolatomens möjligheter att bilda olika föreningar konkretiseras.", "Struktur och egenskaper kan kopplas närmare ihop.", "Jämför två former av kol och låt eleven koppla struktur till egenskap."], ["Reaktion och notation", "Kemiska reaktioner och kemiska föreningar ingår.", "Avkodning och skrivning av enkla kemiska formler förstärks.", "Mer explicit symbolarbete.", "Låt eleven förklara samma reaktion med ord, partikelbild och formel."], ["Materiens egenskaper", "Partikelmodell och separationsmetoder ingår. Fasövergångar behandlas även i fysik.", "Kemin tar huvudansvar för materiens egenskaper och fasövergångar. Separation får tidigare stadieplacering.", "Omfördelning mellan stadier och ämnen.", "Samordna fasövergångar med fysik och bygg vidare på separation från 5–7."], ["Kropp och näring", "Kemiska processer i kroppen och i naturen.", "Näringsämnen får utrymme på högstadiet tillsammans med andra processer.", "Tidigare stoff flyttas upp och kopplas till kemiska förklaringar.", "Låt eleverna beskriva skillnaden mellan näringsämnets kemiska roll och ett kostråd."], ["Kretslopp", "Vatten och kol i kretslopp samt resursanvändning och miljö.", "Enkel kolcykel introduceras tidigare. Kretslopps- och miljöfrågor bearbetas vidare på högstadiet.", "Tidigare start ger utrymme för tillämpning.", "Utgå från en känd kolcykel och lägg till mänsklig påverkan och energianvändning."], ["Material och industri", "Materialutveckling och processer från råvara till färdig produkt.", "Vissa materials framställning kvarstår. Den industriella produktionskedjan från råvara till produkt behandlas i teknik.", "Ämnesövergripande innehåll får tydligare arbetsdelning.", "Studera materialomvandling i kemi och låt teknikämnet behandla processens system."], ["Säkerhet och undersökning", "Systematiska undersökningar, dokumentation och säker hantering.", "Faropiktogram och förståelse av instruktioner konkretiseras. Undersökningar skiljs från Kemin och samhället.", "Säkerhet och metod behöver framträda var för sig.", "Låt eleven tolka riskinformation före en lärarledd undersökning och motivera resultatet efteråt."]], "Undervisning och bedömning": [["Ämnesstrategier och bedömning", "Ämnesspecifika kriterier för begrepp, samhällsfrågor och undersökningar.", "Välutrustade laborationsmiljöer, modeller och lärarledd förberedelse lyfts. Gemensam skala används.", "Förklaringar behöver visa kemi och inte enbart laborationsrutin.", "Samla underlag från säkerhetsförståelse, tolkning av data och reaktionsförklaringar."]]}}, {"id": 16, "name": "Matematik", "category": "Naturvetenskap, matematik och teknik", "note": "", "sources": [["Lgr22 · innehåll, s. 58", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=60"], ["Lgr22 · E-kriterier, s. 62", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=64"], ["Remissbilaga · PDF-sida 19", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9b04/1793969941398/Matematik%20%E2%80%93%20grundskola.pdf#page=19"]], "sections": {"Innehåll, likheter och skillnader": [["Tal och algebra", "Taluppfattning och algebra utgör separata innehållsområden.", "Aritmetik och algebra samlas. Additiva och multiplikativa strukturer och den distributiva lagen synliggörs.", "Räknesättens strukturer blir en tydligare del av algebran.", "Låt eleven motivera samma omskrivning med både talexempel och generell representation."], ["Ekvationer", "Metoder för ekvationslösning och algebraiska uttryck.", "Linjära ekvationer, enkla specialfall av andra ekvationer och uttryck preciseras.", "Mer konkreta typer och egenskaper anges.", "Bedöm om eleven kan förklara likvärdigheten mellan två steg och kontrollera lösningen."], ["Talstruktur", "Tal i bråk- och decimalform, potenser och räkning med reella tal.", "Primtalsfaktorisering och multiplikativa strukturer framträder uttryckligen.", "Faktorisering får tydligare syfte som strukturkunskap.", "Låt eleven visa hur faktorisering kan användas för bråk och delbarhet."], ["Funktioner", "Funktioner, grafer, proportionella samband och förändringstakt.", "Funktionsnotationen f(x), räta linjens ekvation och växling mellan representationer anges.", "Notation och representationer konkretiseras.", "Pröva om eleven kan röra sig mellan tabell, graf, formel och tolkning av lutning."], ["Geometri", "Geometriska objekt, satser, mätning, skala och beräkningar.", "Formler, geometriska satser, area, volym och skala konkretiseras.", "Fortsatt geometri med tydligare avgränsning av stoffet.", "Låt eleven motivera metodval och jämföra hur längd, area och volym påverkas av skalförändring."], ["Statistik", "Tabeller, diagram, lägesmått och tolkning av data.", "Sortering, representation och analys av olika typer av data utvecklas.", "Valet av representation blir synligt i arbetet.", "Låt eleven välja diagram för samma data och förklara hur valet påverkar tolkningen."], ["Sannolikhet och kombinatorik", "Sannolikhet och enkla kombinatoriska principer.", "Sannolikheter i flera steg och kombinatoriska principer får mer konkret beskrivning.", "Flerstegsresonemang blir lättare att planera och följa upp.", "Jämför beräknad sannolikhet med en enkel simulering och låt eleven förklara skillnaden."], ["Problemlösning", "Eget område för strategier, problemformulering och matematiska modeller.", "Problemlösning, resonemang och kommunikation vävs in i kunskapsområdena och strategierna.", "Användningen av kunskaper återkommer i varje arbetsområde.", "Låt varje område mynna ut i en ny situation där eleverna själva måste välja metod."], ["Programmering", "Programmering används för att lösa problem och pröva modeller i matematik.", "Programmering föreslås utgå som innehåll i matematik och finns som explicit innehåll i teknik.", "Ämnesansvaret flyttas.", "Samordna programmering even förklara vägen från signal till reglerad funktion."], ["Utvecklingsprocess", "Behovsanalys, förslag, konstruktion, utprövning och dokumentation.", "Val jämförs och omprövas löpande. Digital ritning och simulering anges som representationsformer.", "Iteration och teknisk kommunikation konkretiseras.", "Samla två versioner av en lösning och bedöm hur testresultat lett till förändring."], ["Programmering", "Styrning med programmering av egna konstruktioner eller befintliga föremål.", "Visuell och enkel textbaserad programmering samt villkor, loopar, indata, utdata och felsökning preciseras.", "Fler namngivna redskap för att beskriva programlogik.", "Bedöm både fungerande styrning och elevens förmåga att hitta och förklara ett fel."]], "Undervisning och bedömning": [["Undervisningsstrategier och bedömning", "Ämneskriterier för konsekvenser, tekniska lösningar och utvecklingsarbete.", "Gemensam skala används mot innehållet och strategierna vägleder lärarledd teknikundervisning.", "Teknisk förklaring och praktisk process behöver synas tillsammans.", "Samla en systemförklaring, en ritning och en dokumenterad iteration."]]}}, {"id": 39, "name": "Samiska som andraspråk", "category": "Samiska", "note": "Remissbilagan publiceras under sameskolan. Skolverket anger att kursplanen även används vid modersmålsundervisning i samiska i grundskolan.", "sources": [["Lgr22 · innehåll, s. 209", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=211"], ["Lgr22 · E-kriterier, s. 218", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1#page=220"], ["Remissbilaga · PDF-sida 14", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9b3b/1793971055752/Samiska%20som%20andraspr%C3%A5k%20%E2%80%93%20sameskola.pdf#page=14"]], "sections": {"Innehåll, likheter och skillnader": [["Kursplanens ram", "Centralt innehåll för årskurs 7–9 inom det aktuella språkspåret.", "Högstadiets språkspår har eget mål och innehåll.", "Den tid pråkspårets omfattning.", "Informerande och argumenterande muntliga presentationer.", "Presentationstypen konkretiseras.", "Låt eleven först informera och sedan argumentera om samma tema så att syftesanpassningen syns."], ["Ordförråd", "Ord och begrepp för olika sammanhang på samiska, inklusive kulturanknutet ordförråd.", "Planerat ordurval övas återkommande. Ord och uttryck på samiska kopplas till text och muntlig kommunikation.", "Ordarbetet synliggörs som undervisning och inte bara som textinnehåll.", "Återkom till samma ord i läsning, samtal och egen text så att användningen i ett nytt sammanhang kan följas."], ["Grammatik", "Språkets struktur och användning i tal och skrift behandlas.", "Mer konkreta skrivningar om varierad meningsbyggnad, böjning, språkliga nyanser och textbindning.", "Fler uttryckliga ingångar för undervisning om språksystemet.", "Bedöm om den övade strukturen fungerar i elevens egen framställning."], ["Kultur och historia", "Samisk litteratur, kultur, historia och samhällsliv.", "Traditionell och modern jojk, traditionella näringar, sametinget och jämförelser med andra urfolk.", "Kulturella uttryck knyts närmare till utveckling över tid och möten med andra samhällen.", "Knyt ett samiskt kulturuttryck till en samhällsfråga och pröva hur eleven förklarar sambandet."], ["Språkets ställning", "Språk och identitet, kulturarv och villkor där språket används.", "Språkets utveckling och användning kopplas till historiska och samtida villkor.", "Språkets användningsmiljöer blir underlag för ämnesarbete.", "Låt eleven beskriva eller förklara hur språket används i ett valt sammanhang, med stöd av en relevant källa."]], "Undervisning och bedömning": [["Undervisningsstrategier", "Kursplanen anger innehåll och nivåer för språkfärdigheterna.", "Lärarledd förberedelse, gemensamt språk- och textarbete samt återkommande övning får ett eget avsnitt.", "Metodstödet anger hur läsning, skrivande och muntlighet kan byggas upp.", "Välj ett tema och låt samma material först stödja muntlig övning och sedan självständig textbearbetning."], ["Bedömningsunderlag", "Ämneskriterier relateras till elevens aktuella språkspår.", "Gemensamma nivåbeskrivningar tillämpas på den aktuella bilagans mål och innehåll.", "Språkets kvalitet och användning behöver visas över flera kunskapsområden.", "Väg samman läsning, muntlig och skriftlig framställning samt förståelse av kultur och samhälle."]]}}], "overview": {"Läroplanens struktur, värdegrund och uppdrag": [["Skolform och stadier", "Nioårig grundskola. Förskoleklassen är en egen skolform med en egen del i Lgr22.", "Riksdagen har beslutat om tioårig grundskola från hösten 2028. Ny årskurs 1 ersätter förskoleklassen. Stadierna blir 1–4, 5–7 och 8–10.", "Nuvarande högstadium jämförs med samma stadium och motsvarande åldrar i förslaget.", "Mappa 7 till 8, 8 till 9 och 9 till 10 när stadier och övergångar planeras. Läs varje kursplan för avvikelser."], ["Läroplanens delar", "Fem delar. Värdegrund och uppdrag, övergripande mål och riktlinjer, förskoleklass, fritidshem och kursplaner.", "Sju delar. Värdegrund, uppdrag, mål, riktlinjer, fritidshem, timplan och kursplaner.", "Värdegrund, uppdrag, mål och riktlinjer får skilda delar. Timplanen förs in och förskoleklassens del utgår.", "Använd del 1–4 som gemensam ram och läs ämnets bidrag till skolans mål i del 7."], ["Demokrati och mänskliga rättigheter", "Demokratisk grund, mänskliga rättigheter, allas lika värde, jämställdhet och solidaritet.", "Regeringsformens fri- och rättigheter och skollagens värdegrund får en tydligare plats i del 1.", "Värdena består och författningsanknytningen betonas.", "Knyt skolans gemensamma arbete till både rättigheter, skyldigheter och konkreta demokratiska situationer."], ["Saklighet och konfessionsfrihet", "Undervisningen är icke-konfessionell. Saklighet och allsidighet är uttryckliga.", "Saklighet ligger under uppdraget och icke-konfessionell undervisning i värdegrunden. Skydd mot ensidig och kommersiell påverkan skrivs fram.", "Principerna består med ändrad placering och tydliggjord tillämpning.", "Ge eleverna sakunderlag och synliggör vilka perspektiv som behöver belysas i omstridda frågor."], ["Barnets rättigheter och trygghet", "Barnkonventionen, respekt för individen, trygghet och aktivt arbete mot kränkningar.", "Barnkonventionen ska beaktas i alla ärenden som rör barn. Trygghet, studiero och ansvar skrivs även fram i riktlinjerna.", "Flera ansvarsnivåer synliggörs.", "Gör det tydligt vem som tar emot, följer upp och återkopplar när trygghet och studiero brister."], ["Kunskap och bildning", "Kunskaper och värden, livslång lust att lära och olika kunskapsformer framhålls.", "Läsning, skrivning och räkning framhävs som grund. Beständiga kunskaper och en gemensam referensram lyfts tillsammans med praktiska och estetiska erfarenheter.", "Grundläggande färdigheter och långsiktigt kunskapsbyggande får större tyngd.", "Planera vad som ska befästas över tid och hur det gör mer avancerade uppgifter möjliga."], ["Kulturarv och minoriteter", "Skolan förmedlar kulturarv och ger kunskap om nationella minoriteters språk, kultur, historia och religion.", "Skolverkets remiss namnger judar, romer, sverigefinnar, tornedalingar och urfolket samer i del 2. Ämnena preciserar innehåll på olika sätt.", "Gemensamt kulturarv och minoriteternas plats görs mer konkret.", "Samordna ämnenas bidrag så att minoritetsperspektiven återkommer i relevanta kunskapssammanhang."], ["Likvärdighet och stöd", "Utbildningen ska vara likvärdig och anpassas efter varje elevs förutsättningar och behov.", "Del 2 knyter likvärdighet till nationella normer, deltagande i ordinarie undervisning och skolans särskilda stödansvar.", "Det kompensatoriska uppdraget består. Deltagande och förutsättningar ges tydligt utrymme.", "Följ upp vilka elever som faktiskt får öva och visa kunskaper, och justera uppgifter, resurser och stöd."], ["Samhällsanknytning och digital teknik", "Eleverna ska kunna orientera sig i en komplex värld och utveckla förståelse för digitaliseringens möjligheter och risker.", "Samhällsanknytning får en egen underrubrik. Skolan ska lära eleverna använda digital och annan teknik som de har nytta av. Ämnenas skrivningar varierar.", "Digital teknik kopplas till funktion och samhällsförståelse. Vissa digitala inslag flyttas eller omformuleras ämnesvis.", "Kontrollera i varje kursplan vilka digitala verktyg och fenomen som ska behandlas."]], "Skolans mål och riktlinjer": [["Målens form", "Övergripande mål och riktlinjer ligger tillsammans i Lgr22 del 2, med mål för bland annat normer, kunskaper och inflytande.", "Del 3 samlar nio mål för skolgången och del 4 riktlinjerna för de olika rollerna.", "Mål för elevernas utveckling skiljs tydligare från personalens uppgifter.", "Följ upp skolövergripande mål i kvalitetsarbetet och använd respektive ämnes kursplan vid ämnesbedömning."], ["Kunskap, grundfärdigheter och referensram", "Kunskapsmålen anger bland annat språk, matematiskt tänkande, olika ämnesområden och kritisk granskning.", "Målen omfattar kunskapens värde, tidig läsning, skrivning och räkning, grundläggande ämneskunskaper och kritiskt omdöme utifrån en bred referensram.", "De fyra första målen kopplar grundfärdigheter och kunskaper till orientering och omdöme.", "Låt ämnena utveckla läsning, språk och tänkande inom sitt eget innehåll."], ["Demokrati, hållbarhet och respekt", "Demokratiska värden, hållbar utveckling, hälsa och respekt framgår på flera ställen.", "Del 3 samlar mål om demokratiskt deltagande, ekologisk, ekonomisk och social hållbarhet samt respekt och avståndstagande från förtryck och kränkningar.", "Överlappande mål blir lättare att identifiera i ett gemensamt avsnitt.", "Koppla skolans gemensamma arbete till konkreta ämnesexempel och det demokratiska arbetet i vardagen."], ["Ansvar, deltagande och framtid", "Elever utvecklar ansvar och inflytande. Studie- och yrkesval samt kontakter med arbetsliv ingår.", "De två sista målen tar upp ansträngning, uthållighet, delaktighet och respekt samt underbyggda studie- och yrkesval och inblick i kultur-, arbets- och föreningsliv.", "Elevens ansvar och skolans stöd till välgrundade val framhävs.", "Ge inflytande i former som passar elevgruppens mognad och knyt ämnen till verkliga samhällssammanhang."], ["Lärarens undervisning", "Lgr22 anger bland annat anpassning, ledning, stimulans, stöd och tillgång till läromedel.", "Del 4.1 beskriver strukturerad undervisning, arbetsminne, långtidsminne, återkallande, responsiv undervisning och användbar återkoppling.", "Lärarens metoder för att bygga varaktig kunskap skrivs fram mer konkret.", "Dela upp komplexa uppgifter, repetera efter mellanrum och justera undervisningen efter vad eleverna visar."], ["Elevinflytande", "Läraren ska ge reellt inflytande över arbetssätt, arbetsformer och innehåll, med ökat inflytande med ålder och mognad.", "Del 4.2 anger att läraren ansvarar för innehåll och utformning, samtidigt som eleverna får öva ansvar och inflytande och får rättvist utrymme.", "Lärarens innehållsansvar och formerna för inflytande tydliggörs.", "Gör det konkret vilka val eleverna kan påverka och vilka kunskaper undervisningen ska täcka."], ["Skola och hem", "Läraren samverkar med och informerar vårdnadshavare. Rektorn har ansvar för information och kontakter.", "Del 4.3 framhäver vårdnadshavares fostransansvar, skolans kompletterande roll och tydlighet om förväntningar och ordningsregler.", "Rollfördelningen blir mer uttalad.", "Informera om undervisning, stöd och ansvar på ett enhetligt sätt."], ["Övergångar och elevhälsa", "Samverkan mellan skolformer, stadier och fritidshem. Särskild uppmärksamhet för elever i behov av stöd.", "Del 4.4 ger läraren, rektorn och elevhälsan uttryckligt ansvar att särskilt uppmärksamma elever som behöver stöd.", "Samverkan och ansvar kopplas närmare till övergången.", "Överlämna relevanta uppgifter om undervisning, progression och fungerande stöd."], ["Studie- och yrkesvägledning", "Skolan och omvärlden samt vägledning inför fortsatt utbildning behandlas i del 2.6.", "Del 4.5 fördelar ansvar mellan studie- och yrkesvägledare, lärare och rektor. Ämnenas betydelse i arbetslivet lyfts.", "Ansvar och ämnesanknytning blir tydligare.", "Låt ämnesundervisningen ge konkreta exempel på hur dess kunskaper används i arbetslivet."], ["Rektors ansvar", "Rektorn ansvarar bland annat för kvalitet, stöd, strukturerad undervisning, skolbibliotek och läromedel.", "Del 4.1 och 4.7 anger ansvar för lärarnas planeringsförutsättningar, skolmiljö, läromedel och stöd samt kollegialt utbyte och kompetensutveckling.", "Undervisningens förutsättningar och rektorns helhetsansvar framgår i separata avsnitt.", "Planera bemanning, lärmiljöer och kompetensutveckling med hänsyn till kursplanernas strategier."]], "Fritidshem, timplan och kursplaner": [["Fritidshemmets syfte", "Del 4 förenar omsorg, utveckling och lärande och utgår från elevers behov, intressen och erfarenheter.", "Del 5 behåller omsorg, meningsfull fritid och lärande och lägger till ett avsnitt om bidraget till skolans mål.", "Fritidshemmets roll i skolans gemensamma mål blir tydligare.", "Knyt lek, samtal och social gemenskap till syftet när verksamheten planeras och följs upp."], ["Fritidshemmets innehåll", "Språk och kommunikation, skapande och estetiska uttrycksformer, natur och samhälle samt lekar, fysiska aktiviteter och utevistelse.", "Lek får en egen rubrik. Rörelse, hälsa och utevistelse, språk, skapande samt natur och samhälle utvecklas.", "Lek och hälsa får tydligare placering. De flesta kunskapsområden återkommer.", "Planera utrymme för både elevinitierad och lärarledd lek, samt för utevistelse, skapande och samtal."], ["Fritidshemmets strategier", "Syftet beskriver bland annat situationsstyrt, upplevelsebaserat och grupporienterat lärande.", "Undervisningsstrategier konkretiserar lärarens roll, arbetsformer, lärmiljöer och planering utifrån elevgruppen.", "Befintliga arbetssätt kompletteras av tydligare metodstöd.", "Följ upp hur miljöer och gruppindelningar ger eleverna tillgång till olika aktiviteter."], ["Timplan", "Timplanen regleras utanför den tryckta Lgr22. Grundskolan har totalt 6 890 garanterade undervisningstimmar.", "Del 6 föreslår 7 424 timmar. Tillägget 534 timmar avser den nya första årskursen. Högstadiets timmar ändras inte i bilagan.", "Det större timtalet hör till det utökade lågstadiet.", "Planera det mer konkreta högstadiestoffet inom samma timram. Remissens exempel är 280 timmar i idrott och hälsa och 400 i matematik."], ["Kursplanernas byggstenar", "Syfte, centralt innehåll och tillhörande ämnesspecifika kriterier.", "Syfte, bidrag till skolans mål, mål och innehåll, undervisningsstrategier samt betygs- och bedömningskriterier där sådana anges.", "Mål och innehåll beskriver både vad som behandlas och vad eleverna ska lära sig.", "Läs stadiets mål, innehåll och strategier tillsammans vid planering."], ["Generella och ämnesspecifika strategier", "Strukturerad lärarledd undervisning och stöd anges i övergripande riktlinjer. Ämneskursplanen har ingen motsvarande strategidel.", "Generella strategier beskriver bland annat stegvis undervisning, övning och återkoppling. Ämnesstrategier konkretiserar vad det kan innebära i olika ämnen.", "Strategierna får synlig plats i respektive kursplan.", "Välj gemensamma rutiner för repetition och återkoppling och anpassa dem till exempelvis laboration, textsamtal och rörelseövning."]], "Bedömning, betyg och meritvärde": [["Skala och nivåer", "A–F, där E är lägsta godkända betyg och F betecknar underkänt.", "Riksdagen har beslutat om skalan 1–10 utan godkäntgräns i själva skalan. Remissen anger fem kunskapsnivåer som täcker de tio betygsstegen.", "Beslutad reform och remitterade formuleringar har olika status.", "Använd den betygsskala som gäller elevens årskull. Nivåorden motsvarar inga direkta omräkningar från bokstavsbetyg."], ["Betygsnivåerna", "Ämnesspecifika formuleringar för E, C och A. D och B uttrycker en mellanliggande sammantagen nivå.", "Remissens gemensamma nivåer är 1–3 begränsade, 4–5 godtagbara, 6–7 goda, 8–9 mycket goda och 10 utmärkta kunskaper.", "De ämnesspecifika nivåtexterna ersätts av gemensamma nivåord. Ämnesförankringen finns i mål och innehåll.", "Utgå från undervisat innehåll och jämför vad olika elevprestationer visar om samma kunskap."], ["Sammantagen bedömning", "Samtliga delar av E-kriterierna ska vara uppfyllda för godkänt betyg, med de undantag lagen medger. Sammantagen bedömning används för D–A.", "Helhetsbedömningen utsträcks till hela skalan. Relevant och varierat underlag bedöms mot stadiets mål och innehåll.", "Svagare och starkare kunskaper kan vägas samman på alla nivåer.", "Samla brett underlag och värdera relevans, aktualitet och ämnesinnehållets tyngd."], ["Bedömning utan betyg", "Ämnesspecifika bedömningskriterier används där sådana är föreskrivna.", "Remissen anger i normalfallet godtagbara eller begränsade kunskaper vid bedömning där betyg inte sätts. Grundläggande svenska har nivåmål utan egna betygs- och bedömningskriterier.", "Gemensam struktur med särskilda undantag.", "Använd rätt kursplan och stadium vid planering av uppföljning."], ["Samråd", "Kollegial samverkan stödjer likvärdig bedömning.", "Samråd om bedömning inför slutlig betygssättning i årskurs 10 införs för lärare i samma ämne på skolenheten. Undantag gäller när endast en lärare undervisar i ämnet.", "Det kollegiala arbetet får ett särskilt krav vid slutbetyg.", "Avsätt tid för att jämföra elevunderlag och hur de speglar kursplanens mål och innehåll."], ["Nationella prov", "Dagens nationella prov används som stöd för bedömning. Provresultat ska särskilt beaktas vid betygssättning där reglerna gäller.", "Centralt rättade nationella slutprov införs. Skolverket beskriver fem prov för grundskolan, i svenska eller svenska som andraspråk, engelska, matematik, NO och SO.", "Slutproven får en särskild funktion för jämförbara meritvärden.", "Skilj lärarens ämnesbetyg från slutprovens roll vid beräkning av meritvärde."], ["Meritvärde", "Bokstavsbetyg omvandlas till poäng och summeras enligt gällande regler.", "Skolverkets modell använder 70 procent kalibrerat betygsvärde och 30 procent elevens egna slutprovsresultat. Skolans slutprovsresultat används i kalibreringen.", "Meritvärdet beräknas centralt och har två komponenter.", "Förklara för eleverna skillnaden mellan deras betyg, det kalibrerade betygsvärdet och meritvärdet."], ["Övergång 2028–2031", "Nuvarande skala gäller före reformen och för de årskullar som omfattas av övergångsreglerna.", "Elever som börjar nya årskurs 8 hösten 2028 omfattas av nya skalan. Elever i nya årskurs 9 och 10 går klart enligt tidigare betygssystem. Första nya meritvärden i grundskolan 2031.", "Flera årskullar följer olika regler samtidigt.", "Märk lokala planeringar och bedömningsunderlag med årskull och gällande regler."]]}, "links": [["Gällande Lgr22 · upplaga 2025", "https://www.skolverket.se/download/18.2cd92ed197a1b2bbcd5e08f/1752153467251/pdf1"], ["Remissen den 9 november 2026", "https://www.skolverket.se/om-skolverket/det-har-gor-skolverket/skolverkets-remisser/remisser/2026-11-09-remiss-forslag-pa-nya-laroplaner-och-kursplaner-for-grundskolan-anpassade-grundskolan-specialskolan-och-sameskolan"], ["Remiss · värdegrund, uppdrag, mål och riktlinjer", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9a0b/1793968982054/Inledande%20delar%201%20-%204,%20grundskolan.pdf"], ["Remiss · fritidshemmet", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9a0f/1793969029150/Fritidshemmet%20%E2%80%93%20grundskola.pdf"], ["Remiss · timplan", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9a13/1793969062231/Skolverkets%20f%C3%B6rslag%20till%20nya%20timplaner.pdf"], ["Skolverket · konsekvensutredning", "https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9a07/1793968909410/Konsekvensutredning%20Tio%C3%A5rig%20grundskola.pdf"], ["Skolverket · nytt betygssystem", "https://www.skolverket.se/styrning-och-ansvar/en-skola-i-forandring/nytt-betygssystem"], ["Skolverket · aktuella regeländringar", "https://www.skolverket.se/styrning-och-ansvar/en-skola-i-forandring/aktuella-regelandringar"]]};
const search = document.querySelector('#search');
const searchStatus = document.querySelector('#search-status');
const subjects = document.querySelector('#subjects');
const content = document.querySelector('#content');
const sidebar = document.querySelector('.sidebar');
const toggle = document.querySelector('#nav-toggle');
const columns = ['Område','Gällande Lgr22','Remiss 2026','Likhet eller skillnad','Konsekvens för undervisning och bedömning'];
const enc = encodeURIComponent;
const escape = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
const normalize = text => text.toLocaleLowerCase('sv').normalize('NFD').replace(/\p{Diacritic}/gu,'').replace(/[^a-z0-9]+/g,' ').trim();
const ordered = [...data.subjects].sort((a,b) => a.name.localeCompare(b.name,'sv'));
const matchText = new Map(ordered.map(item => [item.id, normalize([item.name,item.category,item.note,...Object.values(item.sections).flat(2)].join(' '))]));
let active = 'overview';

function hashParts() {
  try { return decodeURIComponent(location.hash.slice(1)).split('/'); }
  catch { return ['overview']; }
}
function setMenu(open) {
  sidebar.classList.toggle('open',open);
  toggle.setAttribute('aria-expanded',String(open));
}
function renderNav() {
  const tokens = normalize(search.value).split(' ').filter(Boolean);
  const byGroup = new Map();
  for (const item of ordered) {
    if (!tokens.every(token => matchText.get(item.id).includes(token))) continue;
    if (!byGroup.has(item.category)) byGroup.set(item.category, []);
    byGroup.get(item.category).push(item);
  }
  const groups = ['Övningsämnen','Naturvetenskap, matematik och teknik','Samhällsorienterande ämnen','Svenskämnen','Engelska, moderna språk och teckenspråk','Modersmål','Samiska'];
  subjects.innerHTML = groups.filter(group => byGroup.has(group)).map(group => {
    const links = byGroup.get(group).map(item =>
      `<a class="nav-link" href="#${enc(item.name)}" ${item.name===active?'aria-current="page"':''}>${escape(item.name)}</a>`).join('');
    return `<p class="group">${escape(group)}</p>${links}`;
  }).join('');
  const count = [...byGroup.values()].reduce((sum, group) => sum + group.length, 0);
  const overviewMatch = tokens.length && tokens.every(token => normalize(Object.values(data.overview).flat(2).join(' ')).includes(token));
  searchStatus.textContent = tokens.length ? `${count} ämnesträffar${overviewMatch?' · träff i Hela läroplanen':''}` : '35 grundskolebilagor · 3 samiska spår';
  const home = document.querySelector('.nav-home');
  if (active==='overview') home.setAttribute('aria-current','page');
  else home.removeAttribute('aria-current');
}
function table(rows, heading) {
  return `<table class="compare" aria-labelledby="${heading}"><thead><tr>${columns.map(col=>`<th scope="col">${col}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>
    `<tr><th scope="row">${escape(row[0])}</th>${row.slice(1).map((cell,index)=>`<td><span class="cell-label" aria-hidden="true">${columns[index+1]}</span>${escape(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function sourceLinks(links) {
  return links.map(([label,url])=>`<a class="pill" href="${escape(url)}" target="_blank" rel="noopener noreferrer">${escape(label)} ↗</a>`).join('');
}
function noteSection(name) {
  return `<section class="block notes" aria-labelledby="notes-title"><h2 id="notes-title">Egna anteckningar</h2><label for="notes">Anteckningar för ${escape(name)}</label><textarea id="notes"></textarea><div class="actions"><button class="pill" type="button" id="save-note">Spara lokalt</button><button class="pill secondary" type="button" id="export-note">Exportera som TXT</button></div><p class="note-status" id="note-status" role="status"></p></section>`;
}
function initNotes(name) {
  const notes = document.querySelector('#notes');
  if (!notes) return;
  const key = 'laroplanskompassen-notes-'+name;
  try { notes.value = localStorage.getItem(key) || ''; } catch {}
  document.querySelector('#save-note').onclick = () => {
    const status = document.querySelector('#note-status');
    try { localStorage.setItem(key,notes.value); status.textContent='Anteckningen sparades i den här webbläsaren.'; }
    catch { status.textContent='Lokal lagring är otillgänglig. Exportera anteckningen som TXT.'; }
  };
  document.querySelector('#export-note').onclick = () => {
    const url = URL.createObjectURL(new Blob([name,'\n\n',notes.value],{type:'text/plain;charset=utf-8'}));
    const link = document.createElement('a');
    link.href=url;
    link.download='anteckningar-'+normalize(name).replaceAll(' ','-')+'.txt';
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
}
function render(focusPage=false) {
  const [key, fragment] = hashParts();
  const selected = ordered.find(item => item.name===key);
  const samePage = active === (selected?.name || 'overview') && content.hasChildNodes();
  active = selected?.name || 'overview';
  if (!samePage) {
    const name=selected?.name || 'Hela läroplanen';
    const entries=Object.entries(selected?.sections || data.overview);
    const route=enc(active);
    document.title = name + ' · Läroplanskompassen';
    content.innerHTML=`<section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">${escape(selected?.category || 'Gällande styrdokument och remissförslag')}</p><h1 id="page-title">${escape(name)}</h1>
      <p>${selected ? escape(selected.note || 'Jämförelse av Lgr22 för årskurs 7–9 och remissens mål och innehåll för årskurs 8–10.') : 'Jämför grundskolans gällande Lgr22 med Skolverkets remiss den 9 november 2026. Välj en av de 35 grundskolebilagorna eller ett av de tre samiska spåren i ämnesmenyn.'}</p>
      ${selected ? '' : '<p>Remissens läroplans- och kursplanetexter är förslag. Tioårig grundskola och det nya betygssystemet är beslutade reformer med egna övergångsregler. Remissvar kan lämnas till och med 20 januari 2027.</p>'}
      <div class="actions">${sourceLinks(selected?.sources || data.links.slice(0,2))}<button class="pill secondary" type="button" id="print-page">Skriv ut</button></div>
      <div class="jump">${entries.map(([title],i)=>`<a class="pill secondary" href="#${route}/avsnitt-${i}">${escape(title)}</a>`).join('')}<a class="pill secondary" href="#${route}/kallor">Källor</a></div>
      </section>
      ${entries.map(([title,rows],i)=>`<section class="block" id="avsnitt-${i}"><h2 id="rubrik-${i}">${escape(title)}</h2>${table(rows,'rubrik-'+i)}</section>`).join('')}
      <section class="block" id="kallor"><h2>Källor och läsanvisning</h2><p>Kolumnerna återger och jämför källorna i sammanfattad form. Den sista kolumnen ger exempel på pedagogiska följder och möjliga bedömningsunderlag.</p><div class="actions">${sourceLinks(selected ? [...selected.sources,data.links[5],data.links[6]] : data.links)}</div></section>
      ${selected ? noteSection(name) : ''}
      <footer>Lgr22, uppdaterad upplaga 2025 · Remiss 9 november 2026</footer>`;
    document.querySelector('#print-page').onclick=()=>window.print();
    initNotes(name);
    renderNav();
  }
  if (fragment) document.getElementById(fragment)?.scrollIntoView();
  else if (focusPage) {
    content.focus({preventScroll:true});
    window.scrollTo(0,0);
  }
}
toggle.onclick=()=>{setMenu(!sidebar.classList.contains('open')); if(sidebar.classList.contains('open'))search.focus();};
search.addEventListener('input',renderNav);
search.addEventListener('keydown',event=>{
  if(event.key==='Enter'){
    const first=subjects.querySelector('a');
    if(first){first.click();event.preventDefault();}
  }
});
sidebar.addEventListener('click',event=>{
  if(event.target.closest('a')) {setMenu(false); if(event.target.closest('a').hash===location.hash) render(true);}
});
window.addEventListener('hashchange',()=>{if(location.hash!=='#content') render(true);});
render();
</script>
</body>
</html>
