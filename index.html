function focusFor(name){if(focus[name])return focus[name];if(name.startsWith('Moderna språk'))return ['Hörförståelse och läsning','Muntlig och skriftlig kommunikation','Språkstrategier och språkliga strukturer','Kultur och samhällsliv'];if(name.startsWith('Modersmål'))return ['Läsa och förstå texter','Tala och skriva','Språkets struktur och variation','Kultur, identitet och litteratur'];if(name.startsWith('Svenskt teckenspråk'))return ['Förstå teckenspråk','Uttrycka sig på teckenspråk','Samtal och samspel','Språk och kultur'];return ['Syfte och innehåll','Kunskapsprogression','Undervisningsstrategier','Bedömning'];}
function questions(name){return focusFor(name).map(topic=>[topic,'Kontrollera motsvarande formulering i den gällande kursplanen för '+name+'.','Kontrollera formuleringen för årskurs 8–10 i remissens ämnes-PDF.','Jämförelsen är ännu inte källverifierad; ingen förändring påstås.']);}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tbl(rows){return '<div class="tablewrap"><table><thead><tr><th>Område</th><th>Lgr22 • nuvarande</th><th>Remiss 2026 • förslag</th><th>Likhet / skillnad</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function links(){return `<div class="toolbar"><a class="btn" href="${OLD}" target="_blank" rel="noopener">↗ Gällande kursplaner</a><a class="btn" href="${NEW}" target="_blank" rel="noopener">↗ Remissens originaldokument</a><button class="btn" onclick="window.print()">⎙ Skriv ut / spara PDF</button></div>`}
function overview(){return `<div class="eyebrow">Övergripande jämförelse</div><h2>Hela läroplanen – vad förändras?</h2><p class="intro">Jämför den gällande läroplanens övergripande struktur med Skolverkets remissförslag för en tioårig grundskola. Välj ett ämne i vänstermenyn för en ämnesvis vy.</p><div class="notice">Remissen är inte en beslutad kursplan. Den publicerades 9 november 2026 och remisstiden löper till 20 januari 2027. Tabellen sammanfattar de huvudsakliga strukturella skillnaderna, inte en ord-för-ord-granskning av samtliga inledande läroplansdelar.</div><div class="cards"><div class="card"><strong>7–9 → 8–10</strong><span>Högstadiets årskurser</span></div><div class="card"><strong>A–F → 1–10</strong><span>Föreslagen betygsskala</span></div><div class="card"><strong>2028</strong><span>Planerat införande höstterminen</span></div></div><h3>Övergripande jämförelsetabell</h3>${tbl(globalRows)}<details><summary>Så läser du jämförelsen</summary><p>”Ny” betyder att något uttryckligen förekommer i remissförslaget, inte nödvändigtvis att det tidigare var förbjudet. ”Inte uttryckligen nämnt” betyder att formuleringen inte återfinns i den jämförda delen. Stadierna är inte identiska till årskursnumren men avser motsvarande högstadieåldrar.</p></details>${links()}<p class="foot">Källor: Skolverkets remiss 9 november 2026, information om nya läro- och kursplaner samt nuvarande kursplaneförteckning. Se originaldokumenten för juridiskt bindande formuleringar.</p>`}
function generic(name){return `<div class="eyebrow">Ämnesvis granskningsunderlag • ej verifierad innehållsjämförelse</div><h2>${esc(name)}</h2><p class="intro">Det här ämnet har nu en egen ämnesspecifik granskningsstruktur. De fyra områdena nedan är <strong>granskningsfrågor, inte belagda skillnader</strong>. Fullständig jämförelse kräver kontroll av båda originaltexterna.</p><div class="notice">Inga påståenden om förändringar i ${esc(name.toLowerCase())} görs utan källkontroll. Använd länkarna till båda kursplanerna för att granska formuleringarna.</div><h3>Fyra centrala områden att jämföra</h3>${tbl(questions(name))}<h3>Gemensamma strukturella förändringar</h3>${tbl(globalRows.filter(r=>['Högstadiet','Ämneskursplanernas struktur','Innehållets indelning','Undervisningsstrategier','Bedömning','Status'].includes(r[0])))}${links()}`}
const mathRows=[
['Struktur','Centralt innehåll för åk 7–9 och betygskriterier.','Mål och innehåll för åk 8–10 samt generella och ämnesspecifika undervisningsstrategier.','Förslaget ger betydligt fler anvisningar om undervisningens genomförande.'],

['Samband och funktioner','Proportionalitet, förändring, funktioner och grafer ingår.','Samband och funktioner är ett särskilt namngivet kunskapsområde.','Funktioner är fortsatt centrala, men organiseras inom en ny kursplanestruktur.'],

['Statistik och sannolikhet','Statistik, sannolikhet, tolkning och värdering av data.','Statistik och sannolikhet är ett namngivet kunskapsområde.','Samma övergripande område i båda kursplanerna.'],
['Lärarledd diskussion','Matematiska resonemang och kommunikation ingår i ämnets syfte.','Förslaget beskriver lärarledda diskussioner där elevers resonemang fångas upp och missuppfattningar rättas.','Mer detaljerad didaktisk vägledning.'],
['Modellering och återkoppling','Metoder och problemlösning ingår i undervisningen.','Läraren ska modellera angreppssätt, fallgropar och självkorrigering samt ge återkoppling.','Förslaget konkretiserar undervisningsmetoderna.'],
['Repetition och långtidsminne','Ingen motsvarande detaljerad ämnesspecifik metodbeskrivning i kursplanen.','Systematisk återkallning, varierad repetition och successivt ökad tid mellan repetitionstillfällen beskrivs.','Större tonvikt på befästa kunskaper över tid.'],
['Bedömning','Betygskriterierna uttrycks med nivåer för E, C och A.','Betygsskala 1–10 med sammantagen bedömning utifrån mål och innehåll.','Ny betygsstruktur och mindre detaljerade nivåbeskrivningar.']
];
const MATH_PDF='https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9b04/1793969941398/Matematik%20%E2%80%93%20grundskola.pdf';
function maths(){return `<div class="eyebrow">Källbaserad ämnesjämförelse • delvis kontrollerad</div><h2>Matematik</h2><p class="intro">Jämförelse av övergripande innehåll och undervisningsstrategier. Den nya matematikbilagan är kontrollerad, men detaljerade påståenden om varje enskilt moment i årskurs 8–10 kräver fortsatt avstämning.</p><div class="notice">Detta är ännu inte en fullständig rad-för-rad-jämförelse av högstadieinnehållet. Avgränsningen anges i tabellen.</div>${tbl(mathRows)}<div class="toolbar"><a class="btn primary" target="_blank" rel="noopener" href="${MATH_PDF}">↗ Läs matematikförslaget (PDF)</a></div>${links()}`}
function sports(){return `<div class="eyebrow">Fördjupad ämnesjämförelse</div><h2>Idrott och hälsa</h2><p class="intro">Detaljerad jämförelse av nuvarande årskurs 7–9 med remissförslagets årskurs 8–10, utifrån den bifogade 13-sidiga remissbilagan och Skolverkets gällande kursplan.</p><div class="notice good">Detta ämne har en innehållsbaserad jämförelse. Tabellen skiljer mellan det som uttryckligen står i dokumenten och tolkningar av vad det kan betyda för undervisningen.</div><div class="toolbar">${Object.keys(idrott).map((s,i)=>`<a class="btn" href="#s${i}">${esc(s)}</a>`).join('')}</div>${Object.entries(idrott).map(([s,rows],i)=>`<section class="section" id="s${i}"><h3>${esc(s)}</h3>${tbl(rows)}</section>`).join('')}<h3>Viktigaste konsekvenserna</h3><p>Förslaget betonar längre arbetsområden, återkommande övning, tydlig demonstration, individanpassning och riktad återkoppling. Orientering med kompass och praktiska friluftsfärdigheter beskrivs tydligare. Betygskriterierna är samtidigt mer övergripande.</p>${links()}<p class="foot">Remissbilagan ”Idrott och hälsa – grundskola”, särskilt sidorna 9–13. Denna jämförelse är en bearbetad sammanfattning, inte ett officiellt Skolverksdokument.</p>`}

const bildRows=[
['Bildframställning','Två- och tredimensionellt bildarbete med traditionella och digitala tekniker.','Teckning, måleri, tryck, foto, film, animation, digital bearbetning, skulptur och modellbygge namnges.','Liknande bredd; nya förslaget räknar upp tekniker och betonar hantverksmässig skicklighet.'],
['Arbetsuppgifter','Eleverna framställer bilder med olika uttryck, syften och funktioner.','Både styrda uppgifter och öppnare arbeten utifrån egna idéer beskrivs.','Tydligare kombination av lärarstyrning och eget skapande.'],
['Teknisk skicklighet','Tekniker, verktyg och material används i bildframställning.','Eleverna ska få tid för övning och fördjupning, precision och teknisk problemlösning.','Starkare uttryckligt fokus på övning och handlag.'],
['Perspektiv och rumslighet','Perspektiv och rumslighet behandlas inom bildframställning.','Enpunktsperspektiv kompletteras med tvåpunktsperspektiv; trepunktsperspektiv och luftperspektiv kan fördjupas.','Mer specifika tekniska kunskaper.'],
['Komposition','Bildkomposition och hur uttryck skapas med bildelement.','Linjer, valörer, färger, kontraster, proportioner, utsnitt och vinklar anges.','Detaljerad beskrivning av bildens byggstenar.'],
['Digitalt bildskapande','Digitala verktyg för bildframställning och bearbetning.','Digital bildbearbetning, foto, film och animation ingår uttryckligen.','Digitalt arbete kvarstår och konkretiseras.'],
['Bildanalys','Tolka och kritiskt granska bilder, deras budskap och funktioner.','Kritiskt förhållningssätt till bilders trovärdighet, syfte och sammanhang lyfts i ämnets bidrag till skolans mål.','Liknande kritiskt perspektiv, tydligare kopplat till informationssamhället.'],
['Undervisningsstrategier','Kursplanen föreskriver inte en lika detaljerad metodordning.','Läraren ska demonstrera tekniker stegvis, låta eleverna öva och ge återkoppling.','Ny och tydligare metodstyrning.'],
['Bedömning','Ämnesspecifika betygskriterier för E, C och A.','Övergripande nivåer 1–10 och sammantagen bedömning.','Stor förändring av kriteriernas form.']
];
const BILD_PDF='https://www.skolverket.se/download/18.76a8bb051a1a1b6316b9af8/1793969941115/Bild%20%E2%80%93%20grundskola.pdf';
function bild(){return `<div class="eyebrow">Ämnesspecifik jämförelse</div><h2>Bild</h2><p class="intro">Jämförelse av Lgr22 årskurs 7–9 och remissens årskurs 8–10. Formuleringarna är sammanfattningar, inte ordagranna citat.</p>${tbl(bildRows)}<div class="toolbar"><a class="btn primary" href="${BILD_PDF}" target="_blank" rel="noopener">Läs remissförslaget för bild (PDF)</a></div>${links()}`}

function sourceTools(name){const q=encodeURIComponent('site:skolverket.se '+name+' grundskola kursplan remiss 2026');return `<div class="source-tools"><a href="${OLD}" target="_blank" rel="noopener">Nuvarande kursplan ↗</a><a href="${NEW}" target="_blank" rel="noopener">Remissens PDF-lista ↗</a><a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Sök originaldokument för ${esc(name)} ↗</a></div>`}
function readingNotes(name){const key='laroplanskompassen-notes-'+name;let val='';try{val=localStorage.getItem(key)||''}catch(e){}return `<section class="reading-notes"><strong>Egna granskningsanteckningar – ${esc(name)}</strong><p>Anteckningarna sparas endast i denna webbläsare. Exportera dem som text för säkerhetskopiering.</p><textarea id="notes" placeholder="Notera exakta skillnader och sidnummer…">${esc(val)}</textarea><button onclick="saveNotes(${JSON.stringify(name).replace(/"/g,'&quot;')})">Spara anteckningar</button> <button onclick="exportNotes(${JSON.stringify(name).replace(/"/g,'&quot;')})">Exportera TXT</button></section>`}
function saveNotes(name){try{localStorage.setItem('laroplanskompassen-notes-'+name,document.getElementById('notes').value);alert('Anteckningarna sparades lokalt.')}catch(e){alert('Det gick inte att spara lokalt. Exportera som TXT.')}}
function exportNotes(name){const b=new Blob([name+' – jämförelseanteckningar\n\n'+document.getElementById('notes').value],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='anteckningar-'+name.toLowerCase().replace(/[^a-zåäö0-9]+/g,'-')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function show(id){document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.id===id));document.getElementById('content').innerHTML=(id==='overview'?overview():id==='Idrott och hälsa'?sports():id==='Matematik'?maths():id==='Bild'?bild():generic(id))+(id==='overview'?'':sourceTools(id)+readingNotes(id));history.replaceState(null,'','#'+encodeURIComponent(id));window.scrollTo({top:0,behavior:'instant'});if(innerWidth<801)document.querySelector('aside').classList.remove('show')}
function renderNav(q=''){const filtered=subjects.filter(s=>s.toLocaleLowerCase('sv').includes(q.toLocaleLowerCase('sv')));document.getElementById('subjects').innerHTML=filtered.map(s=>`<button class="navbtn" data-id="${esc(s)}">${esc(s)}${s==='Idrott och hälsa'?'<span class="pill">Fördjupad</span>':s==='Matematik'?'<span class="pill">Påbörjad</span>':''}</button>`).join('')||'<p class="empty">Inga ämnen hittades.</p>';document.getElementById('count').textContent=filtered.length+' ämnen';document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>show(b.dataset.id))}
document.getElementById('search').addEventListener('input',e=>renderNav(e.target.value));renderNav();const initial=decodeURIComponent(location.hash.slice(1));show(initial==='overview'||subjects.includes(initial)?initial:'overview');
</script></body></html>
